name: esphome-displayeditor

services:
  app:
    build:
      context: ./esphome_displayeditor
      args:
        BUILD_VERSION: local
        BUILD_ARCH: amd64
    environment:
      ESPHOME_ALLOW_ANONYMOUS_WRITE: "1"
      ESPHOME_ALLOW_DIRECT_ACCESS: "1"
    ports:
      # The development profile deliberately uses an anonymous local admin.
      # Never publish either listener beyond the Docker host by default.
      - "127.0.0.1:${ESPHOME_EDITOR_PORT:-8099}:8099"
      - "127.0.0.1:${ESPHOME_MCP_PORT:-8100}:8100"
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:

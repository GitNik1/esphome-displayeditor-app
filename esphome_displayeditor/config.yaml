name: ESPHome Display Editor
version: "0.300.0"
slug: esphome_displayeditor
description: Visual LVGL designer and safe ESPHome configuration editor
url: https://github.com/GitNik1/esphome-displayeditor-app
arch:
  - amd64
  - aarch64
homeassistant: "2026.7.0"
startup: application
boot: auto
init: false
stage: experimental
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:monitor-edit
panel_title: ESPHome Display Editor
panel_admin: true
ports:
  8100/tcp: null
ports_description:
  8100/tcp: Model Context Protocol (MCP); read-only unless mcp_access is set to project_write
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
apparmor: true
backup: cold
options:
  access_level: write
  max_file_size_kib: 1024
  protect_sensitive_paths: true
  default_role: viewer
  user_roles: []
  api_rate_limit_per_minute: 240
  write_rate_limit_per_minute: 60
  runtime_provider: native
  request_max_size_kib: 12288
  api_timeout_seconds: 300
  builder_url: "http://5c53de3b-esphome:6052"
  validation_max_age_seconds: 900
  mdi_local: true
  mcp_mode: disabled
  mcp_access: read_only
  mcp_access_token: ""
  mcp_allowed_hosts: "localhost,127.0.0.1,[::1]"
  mcp_allowed_origins: ""
  assistant_mode: disabled
  assistant_api_key: ""
schema:
  access_level: list(none|read|write|write_with_builder)
  max_file_size_kib: int(64,4096)
  protect_sensitive_paths: bool
  default_role: list(viewer|editor|publisher|installer|administrator)
  user_roles:
    - user_id: str
      role: list(viewer|editor|publisher|installer|administrator)
  api_rate_limit_per_minute: int(30,2000)
  write_rate_limit_per_minute: int(5,500)
  runtime_provider: list(native|disabled)
  request_max_size_kib: int(256,16384)
  api_timeout_seconds: int(10,900)
  builder_url: url
  validation_max_age_seconds: int(30,86400)
  mdi_local: bool
  mcp_mode: list(disabled|lan)
  mcp_access: list(read_only|project_write)
  mcp_access_token: password
  mcp_allowed_hosts: str
  mcp_allowed_origins: str
  assistant_mode: list(disabled|enabled)
  assistant_api_key: password

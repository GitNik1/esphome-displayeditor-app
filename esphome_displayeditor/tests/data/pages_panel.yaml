display:
  - platform: test
    id: screen
    dimensions:
      width: 320
      height: 240

lvgl:
  displays: [screen]
  page_wrap: true
  pages:
    - id: main_page
      bg_color: 0x101820
      widgets:
        - label:
            id: main_title
            x: 20
            y: 20
            width: 200
            height: 40
            text: Main page
            text_color: 0xFFFFFF
        - button:
            id: next_page_button
            x: 20
            y: 90
            width: 140
            height: 50
            text: Next page
            on_click:
              - lvgl.page.next: {}
    - id: skipped_page
      skip: true
      widgets:
        - label:
            id: skipped_title
            text: Skipped page
    - id: settings_page
      bg_color: 0x182010
      widgets:
        - label:
            id: settings_title
            x: 20
            y: 20
            width: 200
            height: 40
            text: Settings page
            text_color: 0xFFFFFF
        - button:
            id: main_page_button
            x: 20
            y: 90
            width: 140
            height: 50
            text: Main page
            on_click:
              - lvgl.page.show: main_page
  bottom_layer:
    bg_color: 0x05080C
    bg_opa: COVER
  top_layer:
    widgets:
      - label:
          id: persistent_header
          x: 190
          y: 205
          width: 120
          height: 24
          text: Always visible
          text_color: 0x66CCFF

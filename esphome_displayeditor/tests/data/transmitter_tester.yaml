        #       - label:
        #           styles: button_lable_style
        #           align: center
        #           text: "TR2"
        #     on_release:
        #       - state_machine.transition: TR2
    - id: messagebox
      layout:
        type: grid
        grid_rows: [FR(1), FR(1), FR(1), FR(1), FR(1), FR(1)]
        grid_columns: [FR(1), FR(1)]
        pad_row: 2px
        pad_column: 2px
      widgets:
        - label:
            id: msgbox_title
            grid_cell_row_pos: 0
            grid_cell_row_span: 2
            grid_cell_column_pos: 0
            grid_cell_column_span: 1
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            text: "Transmitter \nTest:"
            bg_opa: COVER
            styles: lable_style
            long_mode: SCROLL_CIRCULAR
            text_align: LEFT
            radius: 5
        - button:
            id: msgbox_retest
            grid_cell_row_pos: 0
            grid_cell_row_span: 3
            grid_cell_column_pos: 1
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            bg_color: 0xff0000
            bg_grad_color: 0xFFAA42
            bg_grad_dir: VER
            widgets:
              - label:
                  id: msgbox_retest_button_label
                  styles: button_lable_style
                  align: center
                  text: "Abbruch"
            on_release:
              - state_machine.transition: STOP
              - lvgl.page.show: main_page
        - button:
            id: msgbox_ok
            grid_cell_row_pos: 3
            grid_cell_row_span: 3
            grid_cell_column_pos: 0
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            bg_color: 0x0bff00
            bg_grad_color: 0x86ff80
            bg_grad_dir: VER
            widgets:
              - label:
                  id: msgbox_ok_button_label
                  styles: button_lable_style
                  align: center
                  text: "Gut"
            on_release:
              - lambda: !lambda |-
                      id(ambient_value).publish_state(id(amb_value));
                      if(id(board_connected).active_index().value() == 3)
                      {
                        id(tr0_heliosd006_right_value).publish_state(id(tr0_value));
                        id(tr1_heliosd006_right_value).publish_state(id(tr1_value));
                        id(tr2_heliosd006_right_value).publish_state(id(tr2_value));
                      } 
                      else
                      {
                        id(tr0_heliosd006_left_value).publish_state(id(tr0_value));
                        id(tr2_heliosd006_left_value).publish_state(id(tr2_value));
                      }
              - state_machine.transition: NEXT
              - lvgl.page.show: main_page
              - homeassistant.action:
                  action: counter.increment
                  data:
                    entity_id: counter.ls2550_transmittertest_pass
              - binary_sensor.template.publish:
                  id: test_result
                  state: false
        - button:
            id: msgbox_nok
            grid_cell_row_pos: 3
            grid_cell_row_span: 3
            grid_cell_column_pos: 1
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            bg_color: 0xff0000
            bg_grad_color: 0xff8c8c
            bg_grad_dir: VER
            widgets:
              - label:
                  id: msgbox_nok_button_label
                  styles: button_lable_style
                  align: center
                  text: "Schlecht"
            on_release:
              - state_machine.transition: STOP
              - lvgl.page.show: main_page
              - homeassistant.action:
                  action: counter.increment
                  data:
                    entity_id: counter.ls2550_transmittertest_fail
              - binary_sensor.template.publish:
                  id: test_result
                  state: true


        #     on_release:
        #       - state_machine.transition: TR0
        # - button:
        #     id: tr1_button
        #     grid_cell_row_pos: 4
        #     grid_cell_row_span: 2
        #     grid_cell_column_pos: 1
        #     grid_cell_x_align: STRETCH
        #     grid_cell_y_align: STRETCH
        #     widgets:
        #       - label:
        #           styles: button_lable_style
        #           align: center
        #           text: "TR1"
        #           text_line_space: 1
        #     on_release:
        #       - state_machine.transition: TR1
        # - button:
        #     id: tr2_button
        #     grid_cell_row_pos: 4
        #     grid_cell_row_span: 2
        #     grid_cell_column_pos: 2
        #     grid_cell_x_align: STRETCH
        #     grid_cell_y_align: STRETCH

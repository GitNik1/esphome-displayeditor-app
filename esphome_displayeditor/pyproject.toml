[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = ".pytest-tmp/cache"
filterwarnings = [
    "error::ResourceWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
    ".pytest-*",
    ".test-*",
]

[tool.ruff.lint]
# Correctness rules: pyflakes/pycodestyle errors, blocking calls in async
# code, likely bugs, and blind "except Exception" (allowed only with a
# reason in a noqa comment).
select = ["E4", "E7", "E9", "F", "ASYNC", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
# A byte copy of the desktop application (tests/test_core_sync.py) - fixed there.
"backend/designer_core/*" = ["B", "BLE"]
